# Mounted into the container from the repo (see docker-compose.yml): the
# dagster_home named volume masks whatever the image placed here, so a change
# to this file only reaches a running deployment via that bind mount.

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # daily_refresh rebuilds every dbt model - a superset of what
    # markdowns_refresh touches - and dbt's on-run-start DDL and table
    # materialisations are not safe to run twice at once against one Postgres.
    # Dagster's default is 10; serialise instead of racing. Queued runs wait,
    # they are not dropped.
    max_concurrent_runs: 1

# Run, event and schedule storage in Postgres rather than the default SQLite on
# the shared dagster_home volume, which the webserver, the daemon and every run
# subprocess would otherwise write concurrently from two containers.
storage:
  postgres:
    postgres_db:
      username:
        env: PG_USER
      password:
        env: PG_PASSWORD
      hostname:
        env: PG_HOST
      db_name:
        env: PG_DB
      port:
        env: PG_PORT

sensors:
  use_threads: true
  num_workers: 4
