name: CI

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  nox:
    runs-on: ubuntu-latest

    # A database, for two reasons that are easy to conflate.
    #
    # The warehouse session executes the SQL rather than parsing it, which is
    # the only thing that catches a rendered-to-nonsense expression or a model
    # that stops producing a column. It needs no data to do that.
    #
    # And six tests in test_resolution.py skip themselves when no Postgres is
    # reachable. They have been skipping in CI since they were written, which
    # means the SQL behind portal/db.py - every SELECT the portal renders - has
    # never been exercised by a gate. A silent skip is a green check that
    # proves nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Install uv (official action)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Optional: ensure a specific Python is available for nox "python=['3.12']"
      - name: Install Python 3.12
        run: uv python install 3.12

      # Show nox (via uvx)
      - name: nox --version
        run: uvx nox --version

      # Lint Python (Ruff)
      - name: nox -s lint_python
        run: uvx nox -s lint_python

      # Lint SQL (sqlfluff + your dbt parse step)
      - name: nox -s lint_sql
        run: uvx nox -s lint_sql

      # Type check
      - name: nox -s types
        run: uvx nox -s types

      # Tests
      - name: nox -s tests
        run: uvx nox -s tests
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DB: postgres

      # Builds the Dagster repository the way the daemon does. Importing the
      # definitions module is not the same check: an op and a job that share
      # a name import fine and fail when the repository is assembled, so this
      # ran green while the daemon it gated could not start at all.
      - name: nox -s definitions
        run: uvx nox -s definitions
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DB: postgres

      # Not path-gated on src/bonuschef/sql. A Python change that renames a
      # column a page reads still needs the database to catch it, and a
      # conditionally-run check is one that is not run - which is how the
      # release gate came to omit the session the test suite depended on.
      - name: nox -s warehouse
        run: uvx nox -s warehouse
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DB: postgres
