name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false

    # The same database CI has. The check list now includes a session that
    # executes the warehouse, and a gate that cannot run the list is the
    # failure this whole arrangement exists to prevent - it is how v1.3.0
    # came not to be cut.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The token the later push will use. Without it here, checkout
          # configures the remote with GITHUB_TOKEN and semantic-release
          # pushes as the Actions app regardless of what it is handed.
          token: ${{ secrets.BONUSCHEF_PAT || secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          # Full history and tags, or semantic-release cannot see the last
          # release and computes the next version from nothing. The default
          # shallow clone fetches one commit and no tags at all.
          fetch-depth: 0
          fetch-tags: true

      - name: Reset to workflow SHA
        run: git reset --hard ${{ github.sha }}

      # A push to main cuts a release. CI only runs on pull requests, so
      # without this a direct push - or a merge that silently broke something -
      # would be tagged and published untested.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `uvx nox` with no -s runs nox.options.sessions from noxfile.py, which
      # is the same list CI runs. Naming sessions here instead is what broke
      # the v1.3.0 release: this list omitted lint_sql, the session that runs
      # `dbt parse`, so the suite could not import the Dagster definitions and
      # died during collection. Two gates drifted and the weaker one guarded
      # the tag. Do not reintroduce -s here.
      - name: Verify before releasing
        run: |
          uv python install 3.12
          uvx nox
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DB: postgres

      # Two PRs merging inside one run's lifetime is now normal, because
      # auto-merge fires the moment checks go green. This run pinned itself to
      # github.sha and then spent four minutes in `nox`; if main moved in that
      # window, semantic-release computes a version from a tree that is no
      # longer the tip, refuses to push, and the run goes red:
      #
      #   [LOCAL SHA] 84adc6a != ee51175 [UPSTREAM SHA]
      #   Upstream branch 'origin/main' has changed!
      #
      # Refusing is right. Going red is not: the merge that moved main
      # triggered its own release run, which releases both commits, so there
      # is nothing lost and nothing to do. Release #44 failed this way and
      # #45 cut 1.11.6 containing both.
      #
      # A red check that is routine and harmless is worse than the race it
      # reports, because it teaches that red means nothing. So this run stands
      # down when it has been superseded, and stays red for every other reason
      # a push can fail.
      - name: Stand down if another push superseded this run
        id: tip
        run: |
          git fetch --quiet origin ${{ github.ref_name }}
          upstream=$(git rev-parse origin/${{ github.ref_name }})
          if [ "$upstream" != "${{ github.sha }}" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main is now $upstream, this run is for ${{ github.sha }}. Its release is cut by the newer run."
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      # BONUSCHEF_PAT, not GITHUB_TOKEN.
      #
      # main requires the `nox` check, and semantic-release pushes its
      # version-bump commit straight to main - a commit that by construction
      # has no check. GITHUB_TOKEN acts as the Actions app, which is not an
      # admin, so the push is rejected:
      #
      #   remote: - Required status check "nox" is expected.
      #   ! [remote rejected] main -> main (protected branch hook declined)
      #
      # A ruleset can exempt an app, but only in an organisation; this is a
      # personal repository and the API refuses the bypass actor. An admin's
      # token is the remaining way, and works because the protection is set
      # to let admins through.
      #
      # It falls back to GITHUB_TOKEN so the workflow is not broken by the
      # secret being absent - it just fails at the push again, which is where
      # it fails today.
      - name: Semantic version release
        id: release
        if: steps.tip.outputs.superseded != 'true'
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.BONUSCHEF_PAT || secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Publish GitHub release
        uses: python-semantic-release/publish-action@v10
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.BONUSCHEF_PAT || secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
