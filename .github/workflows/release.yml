name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Full history and tags, or semantic-release cannot see the last
          # release and computes the next version from nothing. The default
          # shallow clone fetches one commit and no tags at all.
          fetch-depth: 0
          fetch-tags: true

      - name: Reset to workflow SHA
        run: git reset --hard ${{ github.sha }}

      # A push to main cuts a release. CI only runs on pull requests, so
      # without this a direct push - or a merge that silently broke something -
      # would be tagged and published untested.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `uvx nox` with no -s runs nox.options.sessions from noxfile.py, which
      # is the same list CI runs. Naming sessions here instead is what broke
      # the v1.3.0 release: this list omitted lint_sql, the session that runs
      # `dbt parse`, so the suite could not import the Dagster definitions and
      # died during collection. Two gates drifted and the weaker one guarded
      # the tag. Do not reintroduce -s here.
      - name: Verify before releasing
        run: |
          uv python install 3.12
          uvx nox

      - name: Semantic version release
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Publish GitHub release
        uses: python-semantic-release/publish-action@v10
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
