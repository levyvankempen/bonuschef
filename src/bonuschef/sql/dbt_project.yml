name: 'bonuschef'
version: '0.1.0'
config-version: 2
profile: 'dbt_bonuschef'

on-run-start:
  # Only portal-owned tables here. ah__bonus_products and ah__store_markdowns
  # are dlt's - it creates them with _dlt_id / _dlt_load_id and a unique
  # constraint this DDL did not, so two owners raced for one schema.
  - >
    CREATE TABLE IF NOT EXISTS public.recipes (
      recipe_id INTEGER NOT NULL,
      recipe_name TEXT NOT NULL,
      servings INTEGER NOT NULL
    )
  - >
    CREATE TABLE IF NOT EXISTS public.recipe_ingredients (
      recipe_id INTEGER NOT NULL,
      product_name TEXT NOT NULL,
      product_link TEXT NOT NULL,
      quantity INTEGER NOT NULL,
      valid_from TIMESTAMP,
      valid_to TIMESTAMP
    )
  - >
    CREATE TABLE IF NOT EXISTS public.product_images (
      product_link TEXT PRIMARY KEY,
      image_url TEXT NOT NULL
    )

vars:
  # How old an observed price may be and still support a savings claim. The
  # GitHub snapshot source loads weekly, so 45 days is six missed loads - long
  # enough not to fire on ordinary gaps, short enough to exclude the 8,465
  # products last seen in 2025-11.
  max_price_age_days: 45

models:
  bonuschef:
    staging:
      +meta:
        dagster:
          group: staging
    intermediate:
      +meta:
        dagster:
          group: intermediate
    marts:
      +schema: marts
      +materialized: table    
      +meta:
        dagster:
          group: marts
