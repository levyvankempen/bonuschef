name: 'bonuschef'
version: '0.1.0'
config-version: 2
profile: 'dbt_bonuschef'

on-run-start:
  - >
    CREATE TABLE IF NOT EXISTS public.recipes (
      recipe_id INTEGER NOT NULL,
      recipe_name TEXT NOT NULL,
      servings INTEGER NOT NULL
    )
  - >
    CREATE TABLE IF NOT EXISTS public.recipe_ingredients (
      recipe_id INTEGER NOT NULL,
      product_name TEXT NOT NULL,
      product_link TEXT NOT NULL,
      quantity INTEGER NOT NULL,
      valid_from TIMESTAMP,
      valid_to TIMESTAMP
    )
  - >
    CREATE TABLE IF NOT EXISTS public.product_images (
      product_link TEXT PRIMARY KEY,
      image_url TEXT NOT NULL
    )
  - >
    CREATE TABLE IF NOT EXISTS public.ah__bonus_products (
      webshop_id INTEGER,
      title TEXT,
      bonus_mechanism TEXT,
      bonus_start_date TEXT,
      bonus_end_date TEXT,
      price_before_bonus DOUBLE PRECISION,
      bonus_price DOUBLE PRECISION,
      is_bonus BOOLEAN,
      loaded_at TEXT
    )
  - >
    CREATE TABLE IF NOT EXISTS public.ah__store_markdowns (
      store_id BIGINT,
      webshop_id BIGINT,
      title TEXT,
      brand TEXT,
      sales_unit_size TEXT,
      category_title TEXT,
      markdown_type TEXT,
      markdown_percentage DOUBLE PRECISION,
      markdown_expiration_date TEXT,
      stock BIGINT,
      price_was DOUBLE PRECISION,
      price_now DOUBLE PRECISION,
      scraped_at TEXT
    )
  - "{{ seed_default_recipes() }}"

models:
  bonuschef:
    staging:
      +meta:
        dagster:
          group: staging
    intermediate:
      +meta:
        dagster:
          group: intermediate
    marts:
      +schema: marts
      +materialized: table    
      +meta:
        dagster:
          group: marts
