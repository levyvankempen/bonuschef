dbt_bonuschef:
  outputs:

    default:
      type: "postgres"
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      user: "{{ env_var('PG_USER', 'postgres') }}"
      # No default. Compose fails loudly on a missing POSTGRES_PASSWORD; dbt
      # used to fall back to 'postgres' and fail later with an opaque auth
      # error instead of naming the variable that was not set.
      password: "{{ env_var('PG_PASSWORD') }}"
      port: "{{ env_var('PG_PORT', '5455') | int }}"
      dbname: "{{ env_var('PG_DB', 'postgres') }}"
      schema: "public"
      # Measured on the full 20-model build: 1 thread 17.5s, 2 -> 10.6s,
      # 4 -> 8.0s, 6 -> 6.8s, 8 -> no gain. Postgres does ~21 CPU-seconds of
      # work whichever it is, so on the 2 vCPU target that floors the build at
      # ~10.5s and 2 threads already reaches it - 4 would only queue deeper
      # while tripling concurrent temp-file pressure. Raise it on a bigger box.
      threads: "{{ env_var('DBT_THREADS', '2') | int }}"

  target: "{{ env_var('ENVIRONMENT', 'default') }}"
