version: 2

sources:
  - name: "ah"
    description: "Albert Heijn bonus product data via SupermarktConnector API."
    schema: "public"
    tables:
      - name: bonus_products
        identifier: ah__bonus_products
        description: "Promotional products from Albert Heijn, live and expired."
        # This feed went 69 days without loading and nothing reported it; the
        # marts served July promotions as current the whole time.
        loaded_at_field: "loaded_at::timestamptz"
        freshness:
          warn_after: {count: 36, period: hour}
          error_after: {count: 7, period: day}
        meta:
          dagster:
            asset_key: ["ah__bonus_products"]
      - name: store_markdowns
        identifier: ah__store_markdowns
        description: >
          Append-only snapshots of store-specific markdowns ("laatste kans
          koopjes") — reduced-to-clear and discontinued stock. One row per
          item per scrape; the discount deepens intraday.
        # Scraped hourly 11:00-20:00 and judged once at 09:45, which is the
        # furthest point from the last scrape rather than the nearest.
        #
        # Three hours is the right tolerance INSIDE the window and meaningless
        # outside it: at 09:45 the freshest possible scrape is yesterday's
        # 20:00 one, 13h45m old, so this warned on every single run it ever
        # made. A threshold that always fires reports nothing - it just makes
        # the one that matters harder to see.
        #
        # Sixteen hours is the band that means something at that hour: a
        # healthy night is 13h45m and passes, while 16-24h means the evening
        # scrapes stopped, and beyond 24h the error already covered it.
        loaded_at_field: scraped_at
        freshness:
          warn_after: {count: 16, period: hour}
          error_after: {count: 24, period: hour}
        meta:
          dagster:
            asset_key: ["ah__store_markdowns"]
      - name: pool_recipes
        identifier: ah__pool_recipes
        description: >
          The bounded pool of well-regarded Allerhande recipes, merged weekly on
          recipe_id. Refreshed rather than accumulated, so a recipe that falls
          out of AH's popular listing leaves the pool - unless a person chose it.
        loaded_at_field: "fetched_at::timestamptz"
        freshness:
          # Weekly job. Two weeks means one missed refresh, which is a warning;
          # a month means the job has stopped and nobody noticed.
          warn_after: {count: 14, period: day}
          error_after: {count: 31, period: day}
        meta:
          dagster:
            asset_key: ["ah__recipe_pool"]
      - name: pool_recipe_ingredients
        identifier: ah__pool_recipe_ingredients
        description: >
          Ingredient lines of a pool recipe, keyed on AH's stable
          ingredient-concept id - the same key the adopted-recipe path uses, so
          one confirmed resolution serves both.
        # Loaded in the same run as its parent, so it ages on the same clock.
        # Declared anyway rather than inherited: a silent divergence between the
        # two - ingredients loading while recipes fail - is exactly the state
        # worth catching, and inheritance would hide it.
        loaded_at_field: "fetched_at::timestamptz"
        freshness:
          warn_after: {count: 14, period: day}
          error_after: {count: 31, period: day}
