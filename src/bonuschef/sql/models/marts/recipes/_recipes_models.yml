version: 2

models:
  - name: dim_recipe
    description: "Recipe dimension table."
    columns:
      - name: recipe_id
        description: "Unique ID of the recipe."
        tests:
          - unique
          - not_null
      - name: recipe_name
        description: "Name of the recipe."
        tests:
          - not_null
      - name: servings
        description: "Number of people the recipe serves."
        tests:
          - not_null

  - name: fct_recipe_cost_latest
    tests:
      # The guarantee fct_recipe_cost_history has always had and this mart did
      # not: a partial basket is never published as a total.
      - dbt_utils.expression_is_true:
          expression: "total_cost IS NULL OR price_coverage = 1"
      - dbt_utils.expression_is_true:
          expression: "(total_cost IS NULL) = (cost_per_serving IS NULL)"
    description: "Current total cost per recipe based on latest product prices."
    columns:
      - name: recipe_id
        description: "ID of the recipe."
        tests:
          - unique
          - not_null
      - name: recipe_name
        description: "Name of the recipe."
      - name: servings
        description: "Number of people the recipe serves."
      - name: total_cost
        description: "Total cost of all ingredients at latest prices."
      - name: cost_per_serving
        description: "Total cost divided by number of servings."

  - name: fct_recipe_cost_history
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [recipe_id, snapshot_timestamp]
    description: "Historical recipe cost per snapshot, with SCD2-aware ingredient selection and price coverage tracking."
    columns:
      - name: recipe_id
        description: "ID of the recipe."
        tests:
          - not_null
      - name: recipe_name
        description: "Name of the recipe."
      - name: servings
        description: "Number of people the recipe serves."
      - name: snapshot_timestamp
        description: "Timestamp of the price snapshot."
        tests:
          - not_null
      - name: total_cost_observed
        description: "Sum of item costs for ingredients valid at this snapshot that had a price."
      - name: price_coverage
        description: "Fraction of valid recipe items that had a price (0.0 to 1.0)."
      - name: cost_per_serving_strict
        description: "Cost per serving, only calculated when all valid items have prices."

  - name: fct_recipe_cost_breakdown
    tests:
      # Keyed on the ingredient line, not the product. Two ingredients in one
      # recipe can resolve to the same product - "ui" and "rode ui" both
      # confirmed against a generic onion pack is not hypothetical - and an
      # unresolved ingredient has no product at all.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [recipe_id, item_key]
    description: "Current recipe ingredient cost breakdown with percentage of total."
    columns:
      - name: recipe_id
        description: "ID of the recipe."
        tests:
          - not_null
      - name: recipe_name
        description: "Name of the recipe."
      - name: product_name
        description: "Display name of the ingredient product."
      - name: product_link
        description: >
          Link slug of the chosen product. NULL when no product satisfies the
          ingredient - the row stays so the gap is visible rather than the
          recipe quietly looking cheaper.
      - name: quantity
        description: "Number of units needed."
      - name: price
        description: "Latest unit price of the product."
      - name: item_cost
        description: "Total cost of this ingredient (price x quantity)."
      - name: cost_pct
        description: "Percentage of total recipe cost this ingredient represents."

  - name: fct_recipe_cost_breakdown_bonus
    tests:
      # The one published mart with no declared grain. Its grain is the pair -
      # a recipe's ingredient LINE, not the recipe - and without this a
      # duplicated line silently doubles that ingredient's contribution to the
      # recipe's cost on the Recepten page.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [recipe_id, item_key]
    description: "Recipe ingredient cost breakdown enriched with current AH bonus data."
    columns:
      - name: item_key
        description: "Identifies the ingredient line within the recipe."
        tests:
          - not_null
      - name: recipe_id
        description: "ID of the recipe."
        tests:
          - not_null
      - name: recipe_name
        description: "Name of the recipe."
      - name: product_name
        description: "Display name of the ingredient product."
      - name: product_link
        description: >
          Link slug of the chosen product. NULL when the ingredient resolves to
          nothing, so an unresolved item is visible rather than dropped.
      - name: quantity
        description: "Number of units needed."
      - name: price
        description: "Latest unit price of the product."
      - name: item_cost
        description: "Total cost of this ingredient (price x quantity)."
      - name: cost_pct
        description: "Percentage of total recipe cost this ingredient represents."
      - name: is_on_bonus
        description: "Whether this ingredient is currently on bonus at Albert Heijn."
      - name: bonus_mechanism
        description: "The bonus type (e.g., '25% korting', '2 VOOR 5.50')."
      - name: bonus_start_date
        description: "Start date of the bonus period."
      - name: bonus_end_date
        description: "End date of the bonus period."
      - name: price_before_bonus
        description: "Regular price before the bonus."
      - name: bonus_price
        description: "Current discounted price."
      - name: advertised_savings
        description: "Savings AH claims: (price_before_bonus - bonus_price) * quantity. May be inflated."
      - name: real_savings
        description: "Actual savings vs tracked price: (price - bonus_price) * quantity."

  - name: fct_recipe_opportunity
    description: >
      What is worth cooking today, at one store. Every recipe in the pool keeps
      a row: opportunity_rank is NULL for the ones that are not ranked, and
      exclusion_reason says why. COUNT(*) is the honest size of the pool.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [store_id, recipe_id]
      # Ranked exactly when rankable and actually cheaper.
      - dbt_utils.expression_is_true:
          expression: >
            (opportunity_rank IS NOT NULL)
            = (is_rankable AND COALESCE(saving_total, 0) > 0)
      # Excluded exactly when not ranked. The two must not drift apart.
      - dbt_utils.expression_is_true:
          expression: >
            (exclusion_reason IS NULL) = (opportunity_rank IS NOT NULL)
      # A total is published only for a fully priced basket - the same guarantee
      # fct_recipe_cost_latest makes.
      - dbt_utils.expression_is_true:
          expression: "cost_ordinary IS NULL OR items_priced = items_total"
      - dbt_utils.expression_is_true:
          expression: "cost_today IS NULL OR cost_today <= cost_ordinary"
      - dbt_utils.expression_is_true:
          expression: "saving_total >= 0"
      - dbt_utils.expression_is_true:
          expression: "saving_bonus_only <= saving_total"
      # A lower bound is exactly an incompletely priced basket.
      - dbt_utils.expression_is_true:
          expression: "saving_is_lower_bound = (items_priced < items_total)"
      # Urgency must come from a clearance line or not at all.
      - dbt_utils.expression_is_true:
          expression: >
            items_discounted_clearance > 0
            OR (min_stock_remaining IS NULL AND earliest_expiry IS NULL)
      - dbt_utils.expression_is_true:
          expression: "saving_pct IS NULL OR saving_pct <= 100"
      # The best opportunity is rank 1. Obvious, and it was not true: NULLs sort
      # first under DESC in Postgres, so every unranked recipe counted ahead of
      # the ranked ones and the top row came back as 1988.
      - dbt_utils.expression_is_true:
          expression: >
            opportunity_rank IS NULL OR opportunity_rank <= (
                SELECT COUNT(*) FROM {{ ref('fct_recipe_opportunity') }}
                WHERE opportunity_rank IS NOT NULL
            )
    columns:
      - name: store_id
        tests: [not_null]
      - name: recipe_id
        # Deliberately no relationship to dim_recipe: a pool recipe is ranked
        # without being one of the person's own, and that absence is the point.
        tests: [not_null]
      - name: is_rankable
        tests: [not_null]
      - name: saving_is_lower_bound
        tests: [not_null]
      - name: exclusion_reason
        tests:
          - accepted_values:
              values: ['no_ingredients', 'no_priced_ingredient', 'no_discount_today']
      - name: clearance_scraped_at
        description: >
          NULL until the store has been scraped. Nullable on purpose: the
          spine is built from the stores accounts use, so a shop can have an
          account and no scrape yet. "Not scraped" is a different statement
          from "scraped and found nothing", and a not_null test here would
          fail a new account's store rather than report it.

  - name: fct_recipe_opportunity_items
    description: >
      The named ingredients behind a ranking row, at full grain so that an
      excluded recipe's unresolved line stays visible.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [store_id, recipe_id, item_key]
    columns:
      - name: offer_product_link
        description: >
          The candidate the discount was found on. May differ from
          ordinary_product_link: a sibling product of the same concept can be
          cheapest today without being cheapest ordinarily.
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_link
