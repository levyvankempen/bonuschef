version: 2

models:
  - name: dim_product
    description: "Product dimension with latest known attributes."
    columns:
      - name: product_link
        description: "Link slug of the product (natural key)."
        tests:
          - unique
          - not_null
      - name: product_url
        description: "Full Albert Heijn product URL."
        tests:
          - not_null
      - name: product_name
        description: "Name of the product."
        tests:
          - not_null
      - name: amount
        description: "The volume or size description of the product."
      - name: image_url
        description: "URL of the product image scraped from Albert Heijn (NULL if not yet scraped)."

  - name: fct_products
    description: "Historical price snapshots for all products across all ingested weeks."
    columns:
      - name: product_link
        description: "Link slug of the product."
        tests:
          - not_null
      - name: price
        description: "Price of the product at the snapshot moment."
        tests:
          - not_null
      - name: snapshot_sha
        description: "The git commit SHA of the snapshot."
      - name: snapshot_timestamp
        description: "Timestamp of the price snapshot."
        tests:
          - not_null

  - name: fct_product_price_changes
    description: "Price changes between consecutive snapshots for each product."
    columns:
      - name: product_link
        description: "Link slug of the product."
        tests:
          - not_null
      - name: product_name
        description: "Name of the product."
      - name: prev_snapshot_timestamp
        description: "Timestamp of the previous price snapshot."
      - name: snapshot_timestamp
        description: "Timestamp when the price changed."
        tests:
          - not_null
      - name: prev_price
        description: "Price before the change."
      - name: new_price
        description: "Price after the change."
      - name: price_change
        description: "Absolute price difference (new - old)."
      - name: pct_change
        description: "Percentage price change."

  - name: fct_store_clearance
    description: >
      Current store clearance ("laatste kans koopjes") — the latest snapshot per
      item at each tracked store, with real savings versus the tracked base price.
    columns:
      - name: store_id
        description: "AH store id."
        tests:
          - not_null
      - name: webshop_id
        description: "AH webshop/product id (one row per item; single-store grain)."
        tests:
          - not_null
          - unique
      - name: product_name
        description: "Product title."
        tests:
          - not_null
      - name: markdown_type
        description: "Reason for markdown (EXPIRATION, OUT_OF_ASSORTMENT)."
      - name: markdown_percentage
        description: "Current discount percentage off shelf price."
      - name: markdown_expiration_date
        description: "Date the markdown/product expires."
      - name: stock
        description: "Units remaining at the latest scrape."
      - name: price_was
        description: "Shelf price before markdown (euros)."
      - name: price_now
        description: "Current marked-down price (euros)."
      - name: markdown_amount
        description: "Absolute euro reduction (price_was - price_now)."
      - name: product_link
        description: "Matched tracked product link slug (NULL if unmatched)."
      - name: image_url
        description: "Product image (NULL if not scraped/unmatched)."
      - name: tracked_price
        description: "Latest tracked base price from the GitHub source (NULL if unmatched)."
      - name: real_savings_vs_tracked
        description: "Savings against the tracked base price (tracked_price - price_now)."
      - name: scraped_at
        description: "UTC timestamp of the latest snapshot for this item."
        tests:
          - not_null

  - name: fct_store_clearance_history
    description: >
      Append-only time-series of store markdowns across all scrapes, with each
      item's markdown curve (first/max percentage, first/last seen) so the
      intraday deepening of discounts can be analysed.
    columns:
      - name: store_id
        description: "AH store id."
        tests:
          - not_null
      - name: webshop_id
        description: "AH webshop/product id."
        tests:
          - not_null
      - name: markdown_percentage
        description: "Discount percentage observed at this scrape."
      - name: first_markdown_pct
        description: "Lowest markdown percentage seen for this item."
      - name: max_markdown_pct
        description: "Highest markdown percentage seen for this item."
      - name: first_seen_at
        description: "First scrape this item appeared in clearance."
      - name: last_seen_at
        description: "Most recent scrape this item appeared in clearance."
      - name: is_latest
        description: "Whether this row is the most recent scrape for the item."
      - name: scraped_at
        description: "UTC timestamp of this snapshot."
        tests:
          - not_null

  - name: fct_bonus_price_comparison
    description: "Comparison of tracked product prices with AH bonus prices to detect price inflation."
    columns:
      - name: product_link
        description: "Link slug of the product."
        tests:
          - not_null
      - name: product_name
        description: "Name of the product."
      - name: tracked_price
        description: "Latest tracked price from the GitHub source."
      - name: ah_price
        description: "AH's claimed regular price before the bonus (price_before_bonus)."
      - name: bonus_price
        description: "Current discounted bonus price."
      - name: bonus_mechanism
        description: "The bonus type (e.g., '25% korting', '2 VOOR 5.50')."
      - name: bonus_start_date
        description: "Start date of the bonus period."
      - name: bonus_end_date
        description: "End date of the bonus period."
      - name: price_inflation
        description: "How much AH inflated the before price above tracked price (ah_price - tracked_price)."
      - name: real_savings
        description: "Actual savings vs tracked price (tracked_price - bonus_price)."
      - name: advertised_savings
        description: "Savings AH claims (ah_price - bonus_price)."
      - name: is_inflated
        description: "Whether AH's before price exceeds the tracked price."
