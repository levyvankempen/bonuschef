[project]
name = "bonuschef"
requires-python = ">=3.12"
version = "1.33.6"

dependencies = [
    "dagster>=1.11.11",
    "dagster-dbt>=0.27.11",
    "dagster-dg-cli>=1.11.11",
    "dagster-dlt>=0.27.11",
    "dagster-graphql>=1.11.11",
    "dagster-postgres>=0.27.11, <0.28",
    "dagster-webserver>=1.11.11",
    "dbt-core>=1.10.13",
    "dbt-postgres>=1.9.1",
    # Explicit, though it already arrives through dagster-dg-cli. Passwords
    # are hashed with its scrypt, and a security-relevant dependency that is
    # only present by accident is one an unrelated upgrade can remove.
    "cryptography>=46.0.1",
    "dotenv>=0.9.9",
    "streamlit>=1.50.0",
    "supermarktconnector>=0.8.1",
    "extra-streamlit-components>=0.1.71",
]

description = "Add your description here"
readme = "README.md"

[dependency-groups]
dev = [
    "nox>=2025.5.1",
    "pytest>=8.4.2, <8.4.3",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.2",
    "ruff>=0.13.1, <0.13.2",
    "sqlfluff>=3.4.2, <3.4.3",
    "ty>=0.0.80, <0.1",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.pytest.ini_options]
# Tests needing a warehouse dbt has already built. They run in the `warehouse`
# nox session, after the build, rather than in `tests` - the dependency is a
# prerequisite, not a position in a list, and encoding it as session order
# broke the moment CI ran `tests` first.
markers = ["warehouse: requires a dbt-built warehouse"]
testpaths = ["tests"]
filterwarnings = [
    # Third-party noise we cannot fix here.
    "ignore::DeprecationWarning:pydantic._internal",
    "ignore::DeprecationWarning:dagster_shared",
    "ignore::DeprecationWarning:streamlit",
]

[tool.coverage.run]
source = ["bonuschef"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# dagster, dagster_dbt, dagster_dlt, dlt, streamlit, altair and
# supermarktconnector ship no type information; don't fail on their imports.
unresolved-import = "ignore"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "bonuschef.dags"
registry_modules = [
    "bonuschef.dags.components.*",
]

[tool.dagster]
module_name = "bonuschef.dags.definitions"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

